    <ellipse cx="136.5" cy="160" rx="5.5" ry="2.2"/>
  </g>
  <!-- 口元の明るいところ -->
  <ellipse cx="120" cy="135" rx="25" ry="16" fill="#F3E4D4"/>
  <!-- 顔（全キャラ共通の形。パーツは顔の下のほうに寄せる。少し困った顔） -->
  <g stroke="none">
    <ellipse cx="82" cy="129" rx="10" ry="6.5" fill="#FFB0BE" opacity="0.8"/>
