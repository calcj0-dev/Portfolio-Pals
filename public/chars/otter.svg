    <path d="M20 222 C18 192 42 170 80 172 C102 160 146 158 176 172 C206 176 222 198 220 222 Z" fill="#D3CCC4"/>
    <!-- 双眼鏡と手 -->
    <path d="M92 152 C92 145 113 145 113 152 L113 178 C113 184 92 184 92 178 Z" fill="#8494AB"/>
    <path d="M127 152 C127 145 148 145 148 152 L148 178 C148 184 127 184 127 178 Z" fill="#8494AB"/>
