    <!-- 岩 -->
    <path d="M18 222 C16 194 40 174 78 176 C100 164 144 162 174 176 C204 180 224 200 222 222 Z" fill="#D3CCC4"/>
    <!-- 双眼鏡と手 -->
    <path d="M94 160 C94 154 113 154 113 160 L113 183 C113 188 94 188 94 183 Z" fill="#8494AB" stroke-width="4"/>
    <path d="M127 160 C127 154 146 154 146 160 L146 183 C146 188 127 188 127 183 Z" fill="#8494AB" stroke-width="4"/>
    <path d="M113 167 L127 167" fill="none" stroke-width="4"/>
